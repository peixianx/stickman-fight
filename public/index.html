<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Online Brawl</title><style>
html,body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}#menu{padding:14px}button,input{font-size:17px;padding:9px;margin:4px;border:0;border-radius:8px}button{cursor:pointer}.hidden{display:none}canvas{background:linear-gradient(#26344b,#151922);max-width:100%;touch-action:none}#status{min-height:25px}#again{background:#ffd76a;color:#111;font-weight:800}
</style></head><body><div id="menu"><h2>STICKMAN ONLINE BRAWL</h2><button id="create">Create Room</button><input id="roomInput" maxlength="5" placeholder="ROOM CODE"><button id="join">Join Room</button><button id="again" class="hidden">Fight Again</button><div id="status">Create or join a room — up to 4 players</div><small>Move: A/D or ←/→ · Jump: W/↑ · Attack: F/K · Block: G/L · Weapons: 1 Sword, 2 Spear, 3 Hammer, 4 Axe</small></div><canvas id="c" width="1000" height="600"></canvas>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status'),again=document.querySelector('#again'),keys={};let me=0,room='',playing=false,roster=[];
const W={Sword:[38,50,10],Spear:[48,65,8],Hammer:[32,55,16],Axe:[35,52,13]},names=Object.keys(W),ground=520,cols=['#59a7ff','#ff5c66','#65e572','#d47cff'],starts=[160,380,620,840];
const mk=i=>({x:starts[i-1],y:450,vx:0,vy:0,hp:100,col:cols[i-1],face:i<=2?1:-1,weapon:'Sword',atk:0,block:false,alive:true});let p={};
function ensure(i){if(!p[i])p[i]=mk(i);return p[i]}function reset(){p={};roster.forEach(r=>ensure(r.player));playing=roster.length>=2;again.classList.add('hidden');status.textContent=room+' · '+roster.length+'/4 players'+(playing?' · FIGHT!':' · waiting for players');}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
create.onclick=()=>s.emit('create',r=>{me=r.player;room=r.code;status.textContent='Room '+room+' — share this code (up to 4 players)';});join.onclick=()=>s.emit('join',roomInput.value,r=>{if(!r.ok)return status.textContent=r.reason==='full'?'Room is full (4/4)':'Room not found';me=r.player;room=r.code;status.textContent='Joined '+room;});again.onclick=()=>s.emit('restart');
s.on('roster',r=>{roster=r;let mine=r.find(q=>q.id===s.id);if(mine)me=mine.player;r.forEach(q=>ensure(q.player));Object.keys(p).forEach(k=>{if(!r.some(q=>q.player==k))delete p[k]});if(!playing&&r.length>=2)playing=true;status.textContent='Room '+room+' · '+r.length+'/4 players'+(r.length<2?' · waiting...':' · FIGHT!')});
s.on('ready',()=>{playing=true});s.on('playerLeft',d=>{status.textContent='A player left · '+d.count+'/4 remain';});s.on('state',d=>{if(d.player!==me)Object.assign(ensure(d.player),d.s)});
s.on('hit',d=>{let a=ensure(d.target);if(a.hp<=0)return;a.hp=Math.max(0,a.hp-d.damage);a.vx+=d.push;if(a.hp<=0)a.alive=false;});s.on('weapon',d=>ensure(d.player).weapon=d.weapon);s.on('restart',reset);
let cooldown=0,lastAttack=false;
function targetFor(a){let best=null,dist=1e9;for(const r of roster){if(r.player===me)continue;let o=ensure(r.player);if(o.hp<=0)continue;let dx=o.x-a.x;if(Math.sign(dx)!==a.face)continue;let d=Math.abs(dx);if(d<dist&&Math.abs(o.y-a.y)<65){best=o;best.num=r.player;dist=d}}return best}
function update(){if(!playing||!me)return;let a=ensure(me);if(a.hp<=0)return;let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,jump=keys.w||keys.arrowup,attack=keys.f||keys.k,block=keys.g||keys.l;a.block=!!block;
 if(!block){if(left){a.vx-=.65;a.face=-1}if(right){a.vx+=.65;a.face=1}}if(jump&&a.y>=450)a.vy=-12;a.vy+=.6;a.x+=a.vx;a.y+=a.vy;a.vx*=.84;if(a.y>450){a.y=450;a.vy=0}a.x=Math.max(25,Math.min(975,a.x));if(cooldown)cooldown--;a.atk=Math.max(0,a.atk-1);
 for(let i=1;i<=4;i++)if(keys[String(i)]&&a.weapon!==names[i-1]){a.weapon=names[i-1];s.emit('weapon',{weapon:a.weapon})}
 if(attack&&!lastAttack&&!cooldown){a.atk=10;cooldown=25;let o=targetFor(a);if(o){let [reach,,damage]=W[a.weapon],dx=o.x-a.x;if(Math.abs(dx)<reach+35){let dmg=o.block?Math.ceil(damage*.25):damage;s.emit('hit',{target:o.num,damage:dmg,push:a.face*(o.block?3:9)});}}}lastAttack=attack;
 s.emit('state',{s:{x:a.x,y:a.y,vx:a.vx,vy:a.vy,hp:a.hp,face:a.face,weapon:a.weapon,atk:a.atk,block:a.block,alive:a.hp>0}})}
function stick(a,n){x.save();x.globalAlpha=a.hp<=0?.3:1;x.translate(a.x,a.y);x.strokeStyle=a.col;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,10,10,0,7);x.stroke();x.beginPath();x.moveTo(0,22);x.lineTo(0,48);x.moveTo(0,30);x.lineTo(-15,43);x.moveTo(0,30);x.lineTo(15,43);x.moveTo(0,48);x.lineTo(-13,68);x.moveTo(0,48);x.lineTo(13,68);x.stroke();let len=W[a.weapon][1];x.translate(12*a.face,38);x.rotate(a.atk?-a.face:a.face*.2);x.strokeStyle=a.block?'#eee':'#ffd76a';x.lineWidth=a.weapon==='Hammer'?10:5;x.beginPath();x.moveTo(0,0);x.lineTo(len*a.face,0);x.stroke();x.restore();x.fillStyle='#fff';x.font='13px system-ui';x.textAlign='center';x.fillText(n===me?'YOU':'P'+n,a.x,a.y-8)}
function draw(){x.clearRect(0,0,1000,600);x.fillStyle='#30343c';x.fillRect(0,ground,1000,80);roster.forEach((r,i)=>{let a=ensure(r.player);stick(a,r.player);let bw=210,bx=20+(i%2)*750,by=25+Math.floor(i/2)*52;x.fillStyle='#333';x.fillRect(bx,by,bw,18);x.fillStyle=a.col;x.fillRect(bx,by,bw*Math.max(0,a.hp)/100,18);x.fillStyle='#fff';x.font='13px system-ui';x.textAlign=(i%2)?'right':'left';x.fillText((r.player===me?'YOU':'P'+r.player)+' · '+a.weapon+' · '+a.hp+' HP',(i%2)?bx+bw:bx,by+35)});x.textAlign='center';x.font='bold 21px system-ui';x.fillText(room?'ROOM '+room+' · '+roster.length+'/4':'STICKMAN ONLINE BRAWL',500,35);
 if(playing&&roster.length>=2){let alive=roster.filter(r=>ensure(r.player).hp>0);if(alive.length<=1){playing=false;again.classList.remove('hidden');x.font='bold 42px system-ui';x.fillText(alive.length?(alive[0].player===me?'YOU WIN!':'PLAYER '+alive[0].player+' WINS!'):'DRAW!',500,270);x.font='18px system-ui';x.fillText('Press FIGHT AGAIN for a rematch',500,305)}}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
