<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Online</title><style>html,body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}#menu{padding:18px}button,input{font-size:18px;padding:10px;margin:4px;border:0;border-radius:8px}button{cursor:pointer}canvas{background:linear-gradient(#26344b,#151922);max-width:100%;touch-action:none}#status{min-height:25px}</style></head><body>
<div id="menu"><h2>STICKMAN ONLINE</h2><button id="create">Create Room</button><input id="room" maxlength="5" placeholder="ROOM CODE"><button id="join">Join Room</button><div id="status">Create or join a room</div><button id="rematch" style="display:none;background:#ffd76a;font-weight:700">Fight Again</button><br><small>Move: A/D or ←/→ · Jump: W/↑ · Attack: F/K · Block: G/L · Weapon: 1 Sword, 2 Spear, 3 Hammer, 4 Axe</small></div><canvas id="c" width="1000" height="600"></canvas>
<script src="/socket.io/socket.io.js"></script><script>
const ioS=io(),c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status'),rematch=document.querySelector('#rematch'),keys={};let me=0,room='',playing=false;
const W={Sword:[38,50,10],Spear:[48,65,8],Hammer:[32,55,16],Axe:[35,52,13]}, names=Object.keys(W), ground=520;
const mk=(px,col)=>({x:px,y:450,vx:0,vy:0,hp:100,col,face:px<500?1:-1,weapon:'Sword',atk:0,block:false});let p=[null,mk(220,'#59a7ff'),mk(780,'#ff5c66')];
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
create.onclick=()=>ioS.emit('create',r=>{me=r.player;room=r.code;status.textContent='Room '+room+' — send this code to your friend';});join.onclick=()=>ioS.emit('join',document.querySelector('#room').value,r=>{if(!r.ok)return status.textContent='Room not found/full';me=r.player;room=r.code;status.textContent='Joined '+room+' — get ready!';});
ioS.on('ready',()=>{resetMatch();status.textContent='Room '+room+' — FIGHT!'});ioS.on('left',()=>{playing=false;rematch.style.display='none';status.textContent='Opponent left the room'});
ioS.on('state',d=>{if(d.player!==me)Object.assign(p[d.player],d.s)});ioS.on('hit',d=>{if(d.target===me){p[me].hp=Math.max(0,p[me].hp-d.damage);p[me].vx+=d.push;}});ioS.on('weapon',d=>{if(d.player!==me)p[d.player].weapon=d.weapon});
function resetMatch(){p[1]=mk(220,'#59a7ff');p[2]=mk(780,'#ff5c66');cooldown=0;lastAttack=false;playing=true;rematch.style.display='none';status.textContent='Room '+room+' — FIGHT!'}
rematch.onclick=()=>{if(room)ioS.emit('restart')};
ioS.on('restart',resetMatch);
let cooldown=0,lastAttack=false;
function update(){if(!playing||!me)return;let a=p[me],other=p[me===1?2:1],left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,jump=keys.w||keys.arrowup,attack=keys.f||keys.k,block=keys.g||keys.l;a.block=!!block;
 if(!block){if(left){a.vx-=.65;a.face=-1}if(right){a.vx+=.65;a.face=1}}if(jump&&a.y>=450)a.vy=-12;a.vy+=.6;a.x+=a.vx;a.y+=a.vy;a.vx*=.84;if(a.y>450){a.y=450;a.vy=0}a.x=Math.max(25,Math.min(975,a.x));if(cooldown)cooldown--;a.atk=Math.max(0,a.atk-1);
 for(let i=1;i<=4;i++)if(keys[String(i)]&&a.weapon!==names[i-1]){a.weapon=names[i-1];ioS.emit('weapon',{player:me,weapon:a.weapon})}
 if(attack&&!lastAttack&&!cooldown){a.atk=10;cooldown=25;let [reach,,damage]=W[a.weapon],dx=other.x-a.x;if(Math.sign(dx)===a.face&&Math.abs(dx)<reach+35&&Math.abs(other.y-a.y)<65){let dmg=other.block?Math.ceil(damage*.25):damage;ioS.emit('hit',{target:me===1?2:1,damage:dmg,push:a.face*(other.block?3:9)});}}lastAttack=attack;
 ioS.emit('state',{s:{x:a.x,y:a.y,vx:a.vx,vy:a.vy,hp:a.hp,face:a.face,weapon:a.weapon,atk:a.atk,block:a.block}});}
function stick(a){x.save();x.translate(a.x,a.y);x.strokeStyle=a.col;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,10,10,0,7);x.stroke();x.beginPath();x.moveTo(0,22);x.lineTo(0,48);x.moveTo(0,30);x.lineTo(-15,43);x.moveTo(0,30);x.lineTo(15,43);x.moveTo(0,48);x.lineTo(-13,68);x.moveTo(0,48);x.lineTo(13,68);x.stroke();let len=W[a.weapon][1];x.translate(12*a.face,38);x.rotate(a.atk?-a.face:a.face*.2);x.strokeStyle=a.block?'#eee':'#ffd76a';x.lineWidth=a.weapon==='Hammer'?10:5;x.beginPath();x.moveTo(0,0);x.lineTo(len*a.face,0);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,1000,600);x.fillStyle='#30343c';x.fillRect(0,ground,1000,80);for(let i=1;i<=2;i++){stick(p[i]);x.fillStyle='#333';x.fillRect(i===1?30:670,30,300,22);x.fillStyle=p[i].col;x.fillRect(i===1?30:670,30,3*Math.max(0,p[i].hp),22);x.fillStyle='#fff';x.font='16px system-ui';x.textAlign=i===1?'left':'right';x.fillText((i===me?'YOU':'PLAYER '+i)+' · '+p[i].weapon,i===1?30:970,75)}x.textAlign='center';x.font='bold 22px system-ui';x.fillText(room?'ROOM '+room:'STICKMAN ONLINE',500,35);if(p[1].hp<=0||p[2].hp<=0){playing=false;rematch.style.display='inline-block';status.textContent='Match over — press Fight Again for a rematch';x.font='bold 42px system-ui';x.fillText((p[1].hp<=0?'RED':'BLUE')+' WINS!',500,260)}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
