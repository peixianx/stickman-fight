<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Online Brawl</title><style>
html,body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}#menu{padding:14px}button,input{font-size:17px;padding:9px;margin:4px;border:0;border-radius:8px}button{cursor:pointer}.hidden{display:none}canvas{background:linear-gradient(#26344b,#151922);max-width:100%;touch-action:none}#status{min-height:25px}#again,#start{background:#ffd76a;color:#111;font-weight:800} #start:disabled{opacity:.45;cursor:not-allowed}
</style></head><body><div id="menu"><h2>STICKMAN ONLINE BRAWL</h2><button id="create">Create Room</button><input id="roomInput" maxlength="5" placeholder="ROOM CODE"><button id="join">Join Room</button><button id="start" class="hidden">Start Fight</button><button id="again" class="hidden">Fight Again</button><div id="status">Create or join a room — up to 4 players</div><small>Move: A/D or ←/→ · Jump: W/↑ · Attack: F/K · Block: G/L · Weapons: 1 Sword, 2 Spear, 3 Hammer, 4 Axe, 5 Dagger · DASH: Shift/Space</small><div style="font-size:12px;margin-top:5px;opacity:.8">Sword balanced · Spear long range · Hammer huge damage/knockback · Axe heavy · Dagger fastest</div></div><canvas id="c" width="1000" height="600"></canvas>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status'),again=document.querySelector('#again'),start=document.querySelector('#start'),keys={};let me=0,room='',playing=false,roster=[],isHost=false;
const W={Sword:{reach:38,len:50,damage:10,cool:25,push:9},Spear:{reach:48,len:65,damage:8,cool:30,push:7},Hammer:{reach:32,len:55,damage:20,cool:54,push:14},Axe:{reach:35,len:52,damage:16,cool:42,push:11},Dagger:{reach:25,len:35,damage:6,cool:15,push:5}},names=Object.keys(W),ground=520,cols=['#59a7ff','#ff5c66','#65e572','#d47cff'],starts=[160,380,620,840];
const mk=i=>({x:starts[i-1],y:450,vx:0,vy:0,hp:100,col:cols[i-1],face:i<=2?1:-1,weapon:'Sword',atk:0,block:false,alive:true});let p={};
function ensure(i){if(!p[i])p[i]=mk(i);return p[i]}function lobbyText(){if(playing)return 'Room '+room+' · '+roster.length+'/4 players · FIGHT!';if(roster.length<2)return 'Room '+room+' · '+roster.length+'/4 players · waiting for at least 2 players';return isHost?'Room '+room+' · '+roster.length+'/4 players · press START FIGHT':'Room '+room+' · '+roster.length+'/4 players · waiting for host to start';}function reset(){p={};roster.forEach(r=>ensure(r.player));playing=true;start.classList.add('hidden');again.classList.add('hidden');status.textContent=lobbyText();}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
create.onclick=()=>s.emit('create',r=>{me=r.player;room=r.code;status.textContent='Room '+room+' — share this code (up to 4 players)';});join.onclick=()=>s.emit('join',roomInput.value,r=>{if(!r.ok)return status.textContent=r.reason==='full'?'Room is full (4/4)':'Room not found';me=r.player;room=r.code;status.textContent='Joined '+room;});start.onclick=()=>s.emit('start');again.onclick=()=>s.emit('restart');
s.on('roster',r=>{roster=r;let mine=r.find(q=>q.id===s.id);if(mine){me=mine.player;isHost=!!mine.host}r.forEach(q=>ensure(q.player));Object.keys(p).forEach(k=>{if(!r.some(q=>q.player==k))delete p[k]});if(!playing){start.classList.toggle('hidden',!isHost);start.disabled=r.length<2;status.textContent=lobbyText()}});
s.on('ready',()=>{if(!playing)status.textContent=lobbyText()});s.on('started',()=>{p={};roster.forEach(r=>ensure(r.player));playing=true;start.classList.add('hidden');again.classList.add('hidden');status.textContent=lobbyText()});s.on('playerLeft',d=>{status.textContent='A player left · '+d.count+'/4 remain';});s.on('state',d=>{if(d.player!==me)Object.assign(ensure(d.player),d.s)});
s.on('damage',d=>{let a=ensure(d.target);a.hp=d.hp;a.vx+=d.push;a.alive=a.hp>0;if(d.damage>=13){shake=10;particles.push({x:a.x,y:a.y+30,t:18});}});s.on('weapon',d=>ensure(d.player).weapon=d.weapon);s.on('restart',reset);
let cooldown=0,lastAttack=false,lastDash=false,lastSend=0,shake=0,particles=[],zone=0;
function targetFor(a){let best=null,dist=1e9;for(const r of roster){if(r.player===me)continue;let o=ensure(r.player);if(o.hp<=0)continue;let dx=o.x-a.x;if(Math.sign(dx)!==a.face)continue;let d=Math.abs(dx);if(d<dist&&Math.abs(o.y-a.y)<65){best=o;best.num=r.player;dist=d}}return best}
function update(t){if(!playing||!me)return;let a=ensure(me);if(a.hp<=0)return;let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,jump=keys.w||keys.arrowup,attack=keys.f||keys.k,block=keys.g||keys.l,dash=keys.shift||keys[' '];a.block=!!block;if(dash&&!lastDash&&!a.block){a.vx+=a.face*11}lastDash=dash;
 if(!block){if(left){a.vx-=.65;a.face=-1}if(right){a.vx+=.65;a.face=1}}if(jump&&a.y>=450)a.vy=-12;a.vy+=.6;a.x+=a.vx;a.y+=a.vy;a.vx*=.84;if(a.y>450){a.y=450;a.vy=0}a.x=Math.max(25,Math.min(975,a.x));if(cooldown)cooldown--;a.atk=Math.max(0,a.atk-1);
 for(let i=1;i<=5;i++)if(keys[String(i)]&&a.weapon!==names[i-1]){a.weapon=names[i-1];s.emit('weapon',{weapon:a.weapon})}
 if(attack&&!lastAttack&&!cooldown){let st=W[a.weapon];a.atk=10;cooldown=st.cool;let o=targetFor(a);if(o){let dx=o.x-a.x;if(Math.abs(dx)<st.reach+35)s.emit('hit',{target:o.num,weapon:a.weapon,dir:a.face,blocked:!!o.block});}}lastAttack=attack;
 if(t-lastSend>50){lastSend=t;s.emit('state',{s:{x:a.x,y:a.y,vx:a.vx,vy:a.vy,face:a.face,weapon:a.weapon,atk:a.atk,block:a.block,alive:a.hp>0}})}}
function stick(a,n){x.save();x.globalAlpha=a.hp<=0?.3:1;x.translate(a.x,a.y);x.strokeStyle=a.col;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,10,10,0,7);x.stroke();x.beginPath();x.moveTo(0,22);x.lineTo(0,48);x.moveTo(0,30);x.lineTo(-15,43);x.moveTo(0,30);x.lineTo(15,43);x.moveTo(0,48);x.lineTo(-13,68);x.moveTo(0,48);x.lineTo(13,68);x.stroke();let len=W[a.weapon].len;x.translate(12*a.face,38);x.rotate(a.atk?-a.face:a.face*.2);x.strokeStyle=a.block?'#eee':'#ffd76a';x.lineWidth=a.weapon==='Hammer'?10:5;x.beginPath();x.moveTo(0,0);x.lineTo(len*a.face,0);x.stroke();x.restore();x.fillStyle='#fff';x.font='13px system-ui';x.textAlign='center';x.fillText(n===me?'YOU':'P'+n,a.x,a.y-8)}
function draw(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}x.clearRect(-20,-20,1040,640);x.fillStyle='#30343c';x.fillRect(0,ground,1000,80);x.fillStyle='rgba(255,90,40,.18)';if(zone>0){x.fillRect(0,0,zone,600);x.fillRect(1000-zone,0,zone,600)}roster.forEach((r,i)=>{let a=ensure(r.player);stick(a,r.player);let bw=210,bx=20+(i%2)*750,by=25+Math.floor(i/2)*52;x.fillStyle='#333';x.fillRect(bx,by,bw,18);x.fillStyle=a.col;x.fillRect(bx,by,bw*Math.max(0,a.hp)/100,18);x.fillStyle='#fff';x.font='13px system-ui';x.textAlign=(i%2)?'right':'left';x.fillText((r.player===me?'YOU':'P'+r.player)+' · '+a.weapon+' · '+a.hp+' HP',(i%2)?bx+bw:bx,by+35)});x.textAlign='center';x.font='bold 21px system-ui';x.fillText(room?'ROOM '+room+' · '+roster.length+'/4':'STICKMAN ONLINE BRAWL',500,35);
 particles=particles.filter(q=>{x.fillStyle='#ffd76a';x.beginPath();x.arc(q.x+(18-q.t)*2,q.y-(18-q.t)*2,Math.max(1,q.t/3),0,7);x.fill();q.t--;return q.t>0});if(playing&&roster.length>=2){let alive=roster.filter(r=>ensure(r.player).hp>0);if(alive.length<=1){playing=false;again.classList.remove('hidden');x.font='bold 42px system-ui';x.fillText(alive.length?(alive[0].player===me?'YOU WIN!':'PLAYER '+alive[0].player+' WINS!'):'DRAW!',500,270);x.font='18px system-ui';x.fillText('Press FIGHT AGAIN for a rematch',500,305)}}x.restore()}
function loop(t){update(t||0);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
